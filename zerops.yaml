zerops:
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - cd zeropulse && npm install
        - cd zeropulse && npx prisma generate --schema=packages/db/prisma/schema.prisma
        - cd zeropulse && npm run build --workspace=apps/web
      deployFiles:
        - zeropulse/apps/web/.next
        - zeropulse/apps/web/public
        - zeropulse/apps/web/package.json
        - zeropulse/packages/db/prisma
        - zeropulse/node_modules
      cache:
        - zeropulse/node_modules
        - zeropulse/package-lock.json
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: redis://${cache_hostname}:${cache_port}
        RESEND_API_KEY: ${RESEND_API_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NODE_ENV: production
      initCommands:
        - cd zeropulse && npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma
      start: node zeropulse/node_modules/.bin/next start zeropulse/apps/web

  - setup: worker
    build:
      base: nodejs@22
    buildCommands:
  - apt-get install -y openssl libssl-dev
  - cd zeropulse && npm install --legacy-peer-deps
  - cd zeropulse && npx prisma generate --schema=packages/db/prisma/schema.prisma
  - cd zeropulse/apps/web && npx next build
      deployFiles:
        - zeropulse/apps/worker/dist
        - zeropulse/apps/worker/package.json
        - zeropulse/packages/db/prisma
        - zeropulse/node_modules
      cache:
        - zeropulse/node_modules
        - zeropulse/package-lock.json
    run:
      base: nodejs@22
      envVariables:
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: redis://${cache_hostname}:${cache_port}
        RESEND_API_KEY: ${RESEND_API_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NODE_ENV: production
      start: node zeropulse/apps/worker/dist/index.js