zerops:
  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - npm install
        - npx prisma generate --schema=packages/db/prisma/schema.prisma
        - npm run build --workspace=apps/web
      deployFiles:
        - apps/web/.next
        - apps/web/public
        - apps/web/package.json
        - apps/web/next.config.mjs
        - packages/db/prisma
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: redis://${cache_hostname}:${cache_port}
        RESEND_API_KEY: ${RESEND_API_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NODE_ENV: production
      initCommands:
        - npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma
      start: node apps/web/node_modules/.bin/next start apps/web

  # ── Worker (BullMQ) ────────────────────────────────────────────────────────
  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - npm install
        - npx prisma generate --schema=packages/db/prisma/schema.prisma
        - npm run build --workspace=apps/worker
      deployFiles:
        - apps/worker/dist
        - apps/worker/package.json
        - packages/db/prisma
        - node_modules
    run:
      base: nodejs@22
      envVariables:
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: redis://${cache_hostname}:${cache_port}
        RESEND_API_KEY: ${RESEND_API_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NODE_ENV: production
      start: node apps/worker/dist/index.js
